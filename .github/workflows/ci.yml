# Lint et tests à chaque push et pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # même version de Python que l'image Docker
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dépendances
        run: python -m pip install -q -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests

      - name: Tests
        run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
