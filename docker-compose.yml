services:
  garmin-fitness-trend:
    # image publiée sur GitHub (Intel/AMD et ARM)
    # Pour construire depuis le code source à la place : remplacer par `build: .`
    image: ghcr.io/georgieboyfr/garmin-fitness-trend:0.2.0
    container_name: garmin-fitness-trend
    restart: unless-stopped
    # utilisateur propriétaire du dossier data (voir PUID/PGID dans .env)
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "9193:8000"
    volumes:
      # base, FIT, séries, profils d'altitude, session Garmin ; dépôt de l'export Strava dans data/strava
      - ./data:/data
    env_file:
      - .env
