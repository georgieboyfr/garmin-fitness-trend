<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Fitness Trend{% endblock %}</title>
<script>
  // thème choisi (clair, sombre ou automatique) appliqué avant l'affichage, sans flash
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"></span><span>Fitness Trend</span></a>
    <nav class="nav" aria-label="Pages">
      {% for path, label in nav %}
        <a href="{{ path }}" {% if path == active %}aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" type="button" title="Thème" aria-label="Changer de thème"></button>
      <a class="icon-btn" href="/admin" title="Admin" aria-label="Admin">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.3 7.3 0 0 0-1.68-.98l-.38-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.6.25-1.17.58-1.68.98l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65a7.8 7.8 0 0 0 0 1.94l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.31.6.22l2.49-1c.51.4 1.08.73 1.68.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.6-.25 1.17-.58 1.68-.98l2.49 1c.22.09.47 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="page">
{% block content %}{% endblock %}
</main>

<footer class="footer">Fitness Trend {{ version }}</footer>

<script src="/static/vendor/echarts.min.js?v=5.6.0"></script>
<script src="/static/app.js?v={{ version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
